<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Canvas -->
  <rect width="1200" height="400" fill="#0a0a0a"/>

  <!-- Frame: outer hairline -->
  <rect x="40" y="40" width="1120" height="320" stroke="#2a2a2a" stroke-width="1" fill="none"/>
  <!-- Frame: corner ticks (registration marks) -->
  <g stroke="#6b6b6b" stroke-width="1">
    <line x1="34" y1="40" x2="46" y2="40"/>
    <line x1="40" y1="34" x2="40" y2="46"/>
    <line x1="1154" y1="40" x2="1166" y2="40"/>
    <line x1="1160" y1="34" x2="1160" y2="46"/>
    <line x1="34" y1="360" x2="46" y2="360"/>
    <line x1="40" y1="354" x2="40" y2="366"/>
    <line x1="1154" y1="360" x2="1166" y2="360"/>
    <line x1="1160" y1="354" x2="1160" y2="366"/>
  </g>

  <!-- Top meta row -->
  <text x="64" y="84" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="4" fill="#6b6b6b">PORTFOLIO</text>
  <text x="1136" y="84" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="4" fill="#6b6b6b">EST. 2026</text>

  <!-- Rule under meta -->
  <line x1="64" y1="100" x2="1136" y2="100" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Name: dominant -->
  <text x="600" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="66" letter-spacing="14" fill="#e8e8e6">SASHANK JUNNURU</text>

  <!-- Subtitle caps -->
  <text x="600" y="252" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="7" fill="#9a9a96">COMPUTER SCIENCE &#183; KL UNIVERSITY</text>

  <!-- Divider dot -->
  <circle cx="600" cy="286" r="1.5" fill="#6b6b6b"/>

  <!-- Bottom row: two columns flanking the CGPA number -->
  <g>
    <text x="420" y="330" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="3" fill="#6b6b6b">CUMULATIVE</text>
    <text x="420" y="346" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="3" fill="#6b6b6b">GRADE POINT</text>

    <text x="600" y="344" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="2" fill="#d6cfc4">9.72</text>

    <text x="780" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="3" fill="#6b6b6b">FULL STACK</text>
    <text x="780" y="346" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="3" fill="#6b6b6b">&amp; MACHINE LEARNING</text>
  </g>
